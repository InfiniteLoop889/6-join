<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="icon" type="image/x-icon" href="../assets/icons/flavicon.png" />
    <link rel="stylesheet" href="../styles/reset.css">
    <link rel="stylesheet" href="../styles/signup.css">
    <link rel="stylesheet" href="../styles/add-task.css">
    <link rel="stylesheet" href="../styles/board.css">
    
    <script src="../scripts/api.js"></script>
    <script src="../scripts/validate.js"></script>
    <script src="../scripts/add-task.js"></script>
    <script src="../scripts/login.js"></script>
    <script src="../scripts/signup.js"></script>
    <script src="../script.js"></script>
</head>

<body class="signup-body">
    <div class="max-width-wrapper">
        <header class="header">
            <div class="logo">
                <img src="../assets/icons/join-logo.svg" alt="join-logo" class="join-logo-signup">
            </div>
        </header>

        <main class="main">
            <div class="signup-container">
                <div class="titel-container">
                    <a href="../index.html">
                        <img src="../assets/icons/left-arrow-.png" alt="arrow-icon" class="arrow-icon">
                    </a>
                    <h1 class="login-title">Sign up</h1>
                </div>
                <div class="underline"></div>
                <form class="login-form" type="submit" onsubmit="preventFromSubmit(event); addUser()" novalidate>
                    <div class="input-container" onclick="removeErrorReport(event)">
                        <input type="text" class="signup-input" placeholder="Name" name="name" data-field="name">
                        <img src="../assets/icons/person.svg" alt="person-icon" class="signup-icon">
                    </div>
                    <p class="error-signup" data-field="errorName"></p>
                    <div class="input-container" onclick="removeErrorReport(event)">
                        <input type="email" class="signup-input" placeholder="Email" name="email" data-field="email">
                        <img src="../assets/icons/mail.svg" alt="envelope-icon" class="signup-icon">
                    </div>
                    <p class="error-signup" data-field="errorEmail"></p>
                    <div class="input-container password-margin" onclick="removeErrorReport(event)">
                        <input type="password" class="password-field signup-input" name="password"
                            placeholder="Password" data-field="password"
                            oninput="toggleLockIcon(event, 'firstLock', 'firstEye')">
                        <img src="../assets/icons/lock.svg" alt="lock-icon" class="signup-icon" id="firstLock">
                        <img src="../assets/icons/eye-icon.svg" alt="lock-icon" class="signup-icon"
                            style="display: none;" id="firstEye" onclick="toggleInputType(event, 'password', '.')">
                    </div>
                    <div class="input-container" onclick="removeErrorReport(event)">
                        <input type="password" class="password-field signup-input" name="confirmPassword"
                            placeholder="Confirm Password" data-field="confirmPassword"
                            oninput="toggleLockIcon(event, 'secondLock', 'secondEye')">
                        <img src="../assets/icons/lock.svg" alt="lock-icon" class="signup-icon" id="secondLock">
                        <img src="../assets/icons/eye-icon.svg" alt="lock-icon" class="signup-icon"
                            style="display: none;" id="secondEye"
                            onclick="toggleInputType(event, 'confirmPassword', '.')">
                    </div>
                    <p class="error-signup" data-field="errorPassword"></p>
                    <div class="checkbox-container" onclick="removeErrorReport(event)">
                        <input type="checkbox" id="privacyCheckbox" name="vehicle1">
                        <label for="vehicle1">
                            I accept the <btn class="privacy-text" onclick="openLoggedOutPrivacy('.')">Privacy policy</btn>
                        </label>
                        <p class="error-signup error-signup-policy" data-field="errorPolicy"></p>
                    </div>

                    <div class="button-group">
                        <button class="btn primary signup-btn">Sign in</button>
                    </div>
                </form>
            </div>
        </main>

        <div id="overlay" class="overlay hidden">
            <div class="overlay-wrapper signup-success transit">
                <h2>Signup war erfolgreich!</h2>
            </div>
        </div>

        <footer>
            <div class="Legal-texts">
                <btn class="Privacy-text" onclick="openLoggedOutPrivacy('.')">Privacy policy</btn>
                <btn class="Privacy-text" onclick="openLoggedOutLegal('.')">Legal notice</btn>
            </div>
        </footer>
    </div>
</body>

</html>
